<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Lock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Pattern Lock simulation</h1>
            <p id="message"></p>
        </div>
        <div class="grid">
            <svg id="pattern-grid" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="controls">
            <button id="sim-btn">Simulate</button>
            <button id="clear-btn">Clear</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
